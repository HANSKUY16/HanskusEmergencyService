const grid = document.getElementById("grid");
const searchInput = document.getElementById("searchInput");
const resultCount = document.getElementById("resultCount");
const emptyState = document.getElementById("emptyState");

function renderGrid(){
  const query = searchInput.value.trim().toLowerCase();
  const filtered = tutorials.filter(t => {
    return t.title.toLowerCase().includes(query) || t.desc.toLowerCase().includes(query);
  });

  grid.innerHTML = "";
  filtered.forEach((t, i) => {
    const hasVideo = Boolean(t.video);
    const hasSteps = Array.isArray(t.steps) && t.steps.length > 0;

    let badgeHtml = "";
    if (hasVideo && hasSteps){
      badgeHtml = `<span class="card-badge is-both">🎥📄 Video + Teks</span>`;
    } else if (hasVideo){
      badgeHtml = `<span class="card-badge is-video">🎥 Video</span>`;
    } else if (hasSteps){
      badgeHtml = `<span class="card-badge is-text">📄 Teks</span>`;
    }

    let actionsHtml = "";
    if (hasVideo){
      actionsHtml += `<a class="card-watch" href="${t.video}" target="_blank" rel="noopener">Tonton Video</a>`;
    }
    if (hasSteps){
      actionsHtml += `<button type="button" class="card-toggle" aria-expanded="false" data-index="${i}">Baca Tutorial</button>`;
    }

    const stepsHtml = hasSteps
      ? `<ol class="card-steps" id="steps-${i}">${t.steps.map(s => `<li>${s}</li>`).join("")}</ol>`
      : "";

    const card = document.createElement("article");
    card.className = "card";
    card.innerHTML = `
      <div class="card-top">
        <div class="card-icon">${t.icon}</div>
        ${badgeHtml}
      </div>
      <h3 class="card-title">${t.title}</h3>
      <p class="card-desc">${t.desc}</p>
      ${actionsHtml ? `<div class="card-actions">${actionsHtml}</div>` : ""}
      ${stepsHtml}
    `;
    grid.appendChild(card);

    if (hasSteps){
      const toggleBtn = card.querySelector(".card-toggle");
      const stepsPanel = card.querySelector(`#steps-${i}`);
      toggleBtn.addEventListener("click", () => {
        const isOpen = stepsPanel.classList.toggle("open");
        toggleBtn.setAttribute("aria-expanded", String(isOpen));
        toggleBtn.textContent = isOpen ? "Sembunyikan Tutorial" : "Baca Tutorial";
      });
    }
  });

  resultCount.textContent = `${filtered.length} tutorial ditemukan`;
  emptyState.style.display = filtered.length === 0 ? "block" : "none";
}

searchInput.addEventListener("input", renderGrid);

renderGrid();
</script>
